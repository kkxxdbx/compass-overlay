plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.compassoverlay'
    compileSdk 34

    defaultConfig {
        applicationId "com.compassoverlay"
        minSdk 26
        targetSdk 34
        versionCode 12
        versionName "1.11"
        buildConfigField "String", "UPDATE_URL", "\"https://8080-79eaae0f5c7dd70e.monkeycode-ai.online/version.json\""
        buildConfigField "String", "UMENG_APPKEY", "\"YOUR_UMENG_APPKEY\""
        buildConfigField "String", "UMENG_CHANNEL", "\"github\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            storeFile file('compass-release.jks')
            storePassword 'compass123'
            keyAlias 'compass'
            keyPassword 'compass123'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.umeng.umsdk:common:9.9.6'
    implementation 'com.umeng.umsdk:asms:1.8.7.2'
}
