name: 功能建议
description: 为方向罗盘提出新功能或改进想法
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: feature
    attributes:
      label: 功能描述
      description: 你想要什么功能？解决什么场景的问题？
      placeholder: 例如「添加锁定位置功能，防止误触」
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: 使用场景
      description: 什么情况下你会用到它
